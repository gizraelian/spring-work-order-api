name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package application
        run: ./mvnw clean verify
      - name: Build runtime image
        run: docker build -t spring-work-order-api:local .
      - name: Verify isolated Compose startup and persistence
        run: python3 scripts/verify_compose.py
