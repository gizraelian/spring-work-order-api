# Test-only, full-context PostgreSQL profile. ServiceConnection supplies the container connection.
# Fail closed if that binding is omitted; never inherit DB_URL or the H2 test profile.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/testcontainers-only
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=container-binding-required
spring.datasource.password=container-binding-required
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=127.0.0.1

app.security.username=integration-user
app.security.password=integration-password

spring.flyway.enabled=true
