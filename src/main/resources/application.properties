spring.application.name=work-order-api

# Production-safe defaults: explicit configuration, no schema mutations or migration adoption.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.migrations.approved=false
app.demo.seed=false

app.security.username=${APP_USERNAME:}
app.security.password=${APP_PASSWORD:}
management.endpoints.web.exposure.include=health
