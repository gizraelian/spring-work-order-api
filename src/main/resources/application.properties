spring.application.name=work-order-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workorder}
spring.datasource.username=${DB_USERNAME:workorder_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:change-me}

management.endpoints.web.exposure.include=health
