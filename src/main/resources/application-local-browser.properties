# Explicit personal LOCAL browser profile; combine only with dev (or test in tests).
app.local-browser.enabled=${LOCAL_BROWSER_ENABLED:false}
app.local-browser.allow-loopback-http=false
app.local-browser.compose-isolated=false
# Override dev fallbacks: credentials must be explicitly supplied by the operator.
app.security.username=${APP_USERNAME:}
app.security.password=${APP_PASSWORD:}
server.address=127.0.0.1
server.forward-headers-strategy=none
server.servlet.session.cookie.name=M4CSESSION
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.max-age=-1s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=15m
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
