# Only use with a personal development database; never activate dev on the deployed service.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workorder}
spring.datasource.username=${DB_USERNAME:workorder_app}
spring.datasource.password=${DB_PASSWORD:}
app.security.username=${APP_USERNAME:dev-user}
app.security.password=${APP_PASSWORD:local-demo-only}
spring.flyway.enabled=true
# Fictional seeding remains off unless app.demo.seed=true is explicitly supplied.
